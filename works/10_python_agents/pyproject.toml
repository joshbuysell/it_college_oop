[project]
name = "python-agents"
version = "0.1.0"
description = "AI Agents with Google ADK"
authors = [
    {name = "Viktor Tsvyk"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "google-adk (>=1.31.1,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
